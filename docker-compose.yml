# Single-VPS deployment of the OSINT platform: one PostGIS instance, one API +
# worker per vertical, and one Caddy gateway serving every SPA with path routing
# (osint.nodots.com/ukraine, /elections) plus TLS.
# Copy deploy.env.example to .env and fill it in, then: docker compose up -d
#
# NOTE for stacks upgraded from the standalone ukraine tracker: the elections
# database is created by scripts/pg-init/ only on FIRST init of the pgdata
# volume. On an existing volume create it once by hand:
#   docker compose exec db createdb -U "$DB_USER" elections_tracker
#
# One-time ukraine historical backfill (after the stack is up):
#   docker compose run --rm -e INGEST_MODE=backfill -e BACKFILL_MONTHS=6 \
#     ukraine-worker pnpm --filter @ukraine-tracker/worker ingest
# Occasional UCDP refresh (monthly cadence upstream):
#   docker compose run --rm -e EVENT_SOURCE=ucdp \
#     ukraine-worker pnpm --filter @ukraine-tracker/worker ingest

services:
  db:
    # Multi-arch (amd64 + arm64) PostGIS — a faithful build of postgis/postgis,
    # so the stack runs on any VPS architecture. (Official postgis/postgis is
    # amd64-only for this tag.)
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-osint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Primary database; additional per-vertical databases are created by the
      # init scripts below on first volume init.
      POSTGRES_DB: ${UKRAINE_DB_NAME:-ukraine_tracker}
      ELECTIONS_DB_NAME: ${ELECTIONS_DB_NAME:-elections_tracker}
      # The apps set UTC per-connection; keep the server UTC too for consistency.
      TZ: UTC
    ports:
      # Loopback-only, for `pnpm dev` hot reload against the stack's data —
      # the in-network services keep using db:5432.
      - "127.0.0.1:6543:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-osint} -d ${UKRAINE_DB_NAME:-ukraine_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot schema migrations. Each vertical's api/worker waits for its own
  # migrate service so nothing touches the DB before the tables exist (fixes a
  # first-boot/reboot race).
  ukraine-migrate:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-osint}:${DB_PASSWORD}@db:5432/${UKRAINE_DB_NAME:-ukraine_tracker}
    restart: "no"
    command: pnpm --filter @ukraine-tracker/api db:migrate

  ukraine-api:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      ukraine-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USER:-osint}:${DB_PASSWORD}@db:5432/${UKRAINE_DB_NAME:-ukraine_tracker}
      PORT: "6732"
      # Same-origin via the gateway, so CORS is moot; set the public origin anyway.
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    expose:
      - "6732"
    command: pnpm --filter @ukraine-tracker/api serve

  ukraine-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      ukraine-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USER:-osint}:${DB_PASSWORD}@db:5432/${UKRAINE_DB_NAME:-ukraine_tracker}
      INGEST_MODE: daily
      # Comma-separated list — ingest GDELT strikes and WarSpotting equipment
      # losses each cycle. Control + thermal still run once per invocation.
      EVENT_SOURCE: gdelt,warspotting
      CONTROL_SOURCE: deepstate-github
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      FIRMS_DAYS: "14"
      # Not in the daily EVENT_SOURCE above; passed through so the occasional
      # one-shot UCDP refresh (see header) inherits the token.
      UCDP_API_TOKEN: ${UCDP_API_TOKEN:-}
      # Fixed UTC wall-clock time for the daily run, anchored after GDELT's
      # ~06:00 UTC publish so each run captures the day that just ended.
      INGEST_TIME_UTC: ${INGEST_TIME_UTC:-07:30}
      NODE_OPTIONS: --max-old-space-size=2048
    # Ingest once on start, then daily at INGEST_TIME_UTC (see script header).
    command: sh scripts/ukraine/worker-loop.sh

  elections-migrate:
    build:
      context: .
      dockerfile: Dockerfile.app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-osint}:${DB_PASSWORD}@db:5432/${ELECTIONS_DB_NAME:-elections_tracker}
    restart: "no"
    command: pnpm --filter @elections-tracker/api db:migrate

  elections-api:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      elections-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USER:-osint}:${DB_PASSWORD}@db:5432/${ELECTIONS_DB_NAME:-elections_tracker}
      PORT: "6752"
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
    expose:
      - "6752"
    command: pnpm --filter @elections-tracker/api serve

  elections-worker:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    depends_on:
      elections-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USER:-osint}:${DB_PASSWORD}@db:5432/${ELECTIONS_DB_NAME:-elections_tracker}
      INGEST_MODE: daily
      # Optional; raises CourtListener rate limits (free token from
      # courtlistener.com). Anonymous access works for the daily window.
      COURTLISTENER_TOKEN: ${COURTLISTENER_TOKEN:-}
      # After the ukraine run (07:30) to spread load on the shared db.
      INGEST_TIME_UTC: ${ELECTIONS_INGEST_TIME_UTC:-08:00}
      # Email digest (unset disables): sent only when material changes landed.
      SMTP_URL: ${SMTP_URL:-}
      DIGEST_FROM: ${DIGEST_FROM:-}
      DIGEST_TO: ${DIGEST_TO:-}
      DIGEST_RISK_DELTA: ${DIGEST_RISK_DELTA:-0.02}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # State legislation source (optional; free key from OpenStates).
      OPENSTATES_API_KEY: ${OPENSTATES_API_KEY:-}
      # Path (inside the container) to the MEDSL returns file for the weekly
      # ratings refresh; mount it via volumes when set.
      RATINGS_FILE: ${RATINGS_FILE:-}
    # Ingest once on start, then daily at INGEST_TIME_UTC.
    command: sh scripts/elections/worker-loop.sh

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      - ukraine-api
      - elections-api
    environment:
      # PUBLIC_DOMAIN -> the Caddy site address; blank/unset falls back to :80
      # (plain HTTP). A real domain makes Caddy auto-provision HTTPS.
      SITE_ADDRESS: ${PUBLIC_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
